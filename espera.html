<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nail Glam Estefania — Lista de espera</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFF8FB; --blush: #F2C4D8; --rose: #E8829F;
    --dark-rose: #C45C7A; --espresso: #3A1A28;
    --warm-gray: #A8848E; --light-gray: #F7EBF0; --white: #FFFFFF;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:var(--cream); color:var(--espresso); min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:1.5rem; }
  .card { background:var(--white); border-radius:20px; padding:2.5rem 2rem; max-width:420px; width:100%; box-shadow:0 4px 30px rgba(58,26,40,0.1); text-align:center; }
  .icon { font-size:2.5rem; margin-bottom:1rem; }
  .title { font-family:'Cormorant Garamond',serif; font-size:2rem; font-weight:300; margin-bottom:0.3rem; }
  .title span { font-style:italic; color:var(--rose); }
  .subtitle { font-size:0.75rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--warm-gray); margin-bottom:1.5rem; }
  .msg { font-size:0.9rem; line-height:1.7; color:var(--warm-gray); margin-bottom:1.8rem; }
  .msg strong { color:var(--espresso); }
  .form-row { margin-bottom:1rem; text-align:left; }
  .form-label { display:block; font-size:0.7rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--warm-gray); margin-bottom:0.4rem; }
  .form-input { width:100%; border:1.5px solid var(--light-gray); border-radius:10px; padding:0.75rem 1rem; font-family:'DM Sans',sans-serif; font-size:0.9rem; color:var(--espresso); background:var(--cream); outline:none; transition:border-color 0.2s; }
  .form-input:focus { border-color:var(--rose); }
  .form-input::placeholder { color:#D4B8C0; }
  .btn { width:100%; padding:1rem; background:var(--espresso); color:var(--cream); border:none; border-radius:12px; font-family:'DM Sans',sans-serif; font-size:0.9rem; cursor:pointer; transition:background 0.2s; margin-top:0.5rem; }
  .btn:hover { background:var(--dark-rose); }
  .btn:disabled { background:#CCC; cursor:not-allowed; }
  .success { text-align:center; padding:1rem 0; }
  .success-icon { font-size:3rem; margin-bottom:1rem; }
  .success-title { font-family:'Cormorant Garamond',serif; font-size:1.8rem; margin-bottom:0.5rem; }
  .success-sub { font-size:0.85rem; color:var(--warm-gray); line-height:1.6; }
  .divider { height:1px; background:var(--light-gray); margin:1.5rem 0; }
  .ig-link { display:inline-flex; align-items:center; gap:0.5rem; margin-top:1rem; padding:0.7rem 1.4rem; background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); color:white; border-radius:10px; text-decoration:none; font-size:0.82rem; font-weight:500; }
</style>
</head>
<body>
<div class="card" id="app">
  <div class="icon">💅</div>
  <div class="title">Nail Glam <span>Estefania</span></div>
  <div class="subtitle">Lista de espera</div>
  <div class="msg">
    Actualmente estoy de <strong>baja maternal</strong> pero vuelvo en <strong>octubre</strong>.<br><br>
    Si quieres ser de las primeras en tener cita, apúntate aquí y te llamaré en cuanto abra. ¡Te espero con muchas ganas! 💕
  </div>
  <div class="form-row">
    <label class="form-label">Nombre y apellidos *</label>
    <input class="form-input" id="nombre" type="text" placeholder="Ej: Laura García" maxlength="60">
  </div>
  <div class="form-row">
    <label class="form-label">Teléfono *</label>
    <input class="form-input" id="telefono" type="tel" placeholder="Ej: 612 345 678" maxlength="20">
  </div>
  <button class="btn" id="btnEnviar">Apuntarme a la lista de espera</button>
</div>

<script>
var SHEETDB_URL = "https://sheetdb.io/api/v1/glkmtqp6li07j";

document.getElementById('btnEnviar').addEventListener('click', function(){
  var nombre = document.getElementById('nombre').value.trim();
  var telefono = document.getElementById('telefono').value.trim();
  if (!nombre || !telefono) { alert('Por favor rellena tu nombre y teléfono.'); return; }
  var btn = document.getElementById('btnEnviar');
  btn.textContent = 'Guardando...'; btn.disabled = true;
  fetch(SHEETDB_URL + '?sheet=ListaEsperaApertura', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
    body: JSON.stringify({data: {
      Nombre: nombre,
      'Teléfono': telefono,
      Fecha: new Date().toLocaleDateString('es-ES'),
      Hora: new Date().toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'})
    }})
  }).then(function(){
    document.getElementById('app').innerHTML =
      '<div class="success">'
      +'<div class="success-icon">✓</div>'
      +'<div class="success-title">¡Apuntada!</div>'
      +'<p class="success-sub">Te llamaré en cuanto abra en octubre.<br>¡Muchas gracias por la espera! 💕</p>'
      +'<div class="divider"></div>'
      +'<p style="font-size:0.82rem;color:var(--warm-gray);">Mientras tanto sígueme en Instagram para ver mis trabajos</p>'
      +'<a href="https://instagram.com/nailglam.estefania" target="_blank" class="ig-link">📷 @nailglam.estefania</a>'
      +'</div>';
  }).catch(function(){
    btn.textContent = 'Apuntarme a la lista de espera'; btn.disabled = false;
    alert('Error al guardar. Inténtalo de nuevo.');
  });
});
</script>
</body>
</html>
